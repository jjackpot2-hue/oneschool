<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온스쿨 시간표 & 급식 조회</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; background-color: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .info { margin-bottom: 15px; font-weight: bold; color: #2196F3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 온스쿨 시간표 & 급식</h2>
    
    <div class="search-box">
        <input type="text" id="schoolName" placeholder="학교명을 입력하세요 (예: 빛가람초)">
        <button onclick="searchSchool()">검색</button>
    </div>

    <div id="schoolInfo" class="info">학교를 검색해 주세요.</div>

    <h3>📅 오늘의 시간표</h3>
    <table id="timetable">
        <thead>
            <tr><th>교시</th><th>과목</th></tr>
        </thead>
        <tbody>
            <tr><td colspan="2">검색 후 확인 가능합니다.</td></tr>
        </tbody>
    </table>

    <h3 style="margin-top:20px;">🍱 오늘의 급식</h3>
    <table id="mealTable">
        <thead>
            <tr><th>구분</th><th>메뉴</th></tr>
        </thead>
        <tbody>
            <tr><td colspan="2">검색 후 확인 가능합니다.</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API_KEY = "sample"; // 나이스 공공 API 서비스 키

    async function searchSchool() {
        const schoolName = document.getElementById('schoolName').value.trim();
        if (!schoolName) {
            alert('학교명을 입력해주세요.');
            return;
        }

        const url = `https://open.neis.go.kr/hub/schoolInfo?KEY=${API_KEY}&Type=json&pIndex=1&pSize=5&SCHUL_NM=${encodeURIComponent(schoolName)}`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (data.schoolInfo) {
                const school = data.schoolInfo[1].row[0];
                const atptCode = school.ATPT_OFCDC_SC_CODE;
                const schoolCode = school.SD_SCHUL_CODE;
                const name = school.SCHUL_NM;

                document.getElementById('schoolInfo').innerText = `선택된 학교: ${name}`;

                // 시간표 및 급식 불러오기
                loadTimetable(atptCode, schoolCode);
                loadMeal(atptCode, schoolCode);
            } else {
                alert('검색된 학교가 없습니다.');
            }
        } catch (error) {
            alert('데이터를 불러오는 중 오류가 발생했습니다.');
            console.error(error);
        }
    }

    async function loadTimetable(atptCode, schoolCode) {
        // 기본값: 초등(elsTimetable). 중등(misTimetable), 고등(hisTimetable)으로 변경 가능
        const url = `https://open.neis.go.kr/hub/elsTimetable?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${atptCode}&SD_SCHUL_CODE=${schoolCode}&pIndex=1&pSize=8`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const tbody = document.querySelector('#timetable tbody');
            tbody.innerHTML = '';

            if (data.elsTimetable) {
                const rows = data.elsTimetable[1].row;
                rows.forEach(row => {
                    const tr = `<tr><td>${row.PERIO}교시</td><td>${row.ITRT_CNTNT}</td></tr>`;
                    tbody.innerHTML += tr;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="2">시간표 정보가 없습니다.</td></tr>';
            }
        } catch (error) {
            console.error(error);
        }
    }

    async function loadMeal(atptCode, schoolCode) {
        const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${atptCode}&SD_SCHUL_CODE=${schoolCode}&pIndex=1&pSize=1`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const tbody = document.querySelector('#mealTable tbody');
            tbody.innerHTML = '';

            if (data.mealServiceDietInfo) {
                const row = data.mealServiceDietInfo[1].row[0];
                const mealList = row.DDISH_NM.replace(/<br\/>/g, ', ');
                tbody.innerHTML = `<tr><td>급식</td><td>${mealList}</td></tr>`;
            } else {
                tbody.innerHTML = '<tr><td colspan="2">급식 정보가 없습니다.</td></tr>';
            }
        } catch (error) {
            console.error(error);
        }
    }
</script>

</body>
</html>
