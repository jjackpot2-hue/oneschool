<script>
    const API_BASE_URL = 'https://open.neis.go.kr/hub';
    // 필요 시 개인 나이스 API KEY를 할당할 수 있습니다 (기본 호출도 지원)
    const API_KEY = ''; 

    // 안전한 LocalStorage 접근
    const safeStorage = {
        getItem: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
        setItem: (key, val) => { try { localStorage.setItem(key, val); } catch (e) {} },
        removeItem: (key) => { try { localStorage.removeItem(key); } catch (e) {} }
    };

    // 학교 검색
    function searchSchool() {
        const query = document.getElementById('search-input').value.trim();
        const resultsContainer = document.getElementById('search-results');
        
        if (!query) {
            alert('학교명을 입력해주세요.');
            return;
        }

        resultsContainer.innerHTML = '<p class="text-center text-sm text-slate-400 py-4">검색 중...</p>';

        fetch(`${API_BASE_URL}/schoolInfo?Type=json&SCHUL_NM=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                resultsContainer.innerHTML = '';
                if (data.schoolInfo && data.schoolInfo[1]) {
                    const schools = data.schoolInfo[1].row;
                    schools.forEach(school => {
                        const btn = document.createElement('button');
                        btn.className = 'w-full text-left p-3 rounded-lg hover:bg-blue-50 border border-slate-100 transition-colors mb-2';
                        btn.innerHTML = `
                            <div class="font-bold text-slate-800">${school.SCHUL_NM}</div>
                            <div class="text-xs text-slate-400 mt-0.5">${school.LCTN_SC_NM} | ${school.SCHUL_KND_SC_NM}</div>
                        `;
                        btn.onclick = () => selectSchool({
                            name: school.SCHUL_NM,
                            officeCode: school.ATPT_OFCDC_SC_CODE,
                            schoolCode: school.SD_SCHUL_CODE,
                            kind: school.SCHUL_KND_SC_NM
                        });
                        resultsContainer.appendChild(btn);
                    });
                } else {
                    resultsContainer.innerHTML = '<p class="text-center text-sm text-slate-400 py-4">검색 결과가 없습니다.</p>';
                }
            })
            .catch(() => {
                resultsContainer.innerHTML = '<p class="text-center text-sm text-red-400 py-4">학교 정보를 가져오는 중 오류가 발생했습니다.</p>';
            });
    }

    function selectSchool(schoolInfo) {
        safeStorage.setItem('fixedSchool', JSON.stringify(schoolInfo));
        initApp();
    }

    function initApp() {
        const savedSchool = safeStorage.getItem('fixedSchool');
        if (savedSchool) {
            const schoolInfo = JSON.parse(savedSchool);
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            
            // 오늘 날짜 기본 설정 (YYYYMMDD)
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateStr = `${year}${month}${day}`;

            // 데이터 로드
            loadAllData(schoolInfo, dateStr);
        } else {
            document.getElementById('setup-view').classList.remove('hidden');
            document.getElementById('main-view').classList.add('hidden');
        }
    }

    function loadAllData(schoolInfo, dateStr) {
        // 1. 학사 일정 불러오기
        loadSchedule(schoolInfo, dateStr);
        
        // 2. 급식 정보 불러오기
        loadMeal(schoolInfo, dateStr);

        // 3. 시간표 정보 불러오기
        loadTimetable(schoolInfo, dateStr);
    }

    // --- 학사 일정 API ---
    function loadSchedule(schoolInfo, dateStr) {
        const scheduleCard = document.getElementById('schedule-card');
        const scheduleBox = document.getElementById('schedule-content-box');

        fetch(`${API_BASE_URL}/SchoolSchedule?Type=json&ATPT_OFCDC_SC_CODE=${schoolInfo.officeCode}&SD_SCHUL_CODE=${schoolInfo.schoolCode}&AA_YMD=${dateStr}`)
            .then(res => res.json())
            .then(data => {
                if (data.SchoolSchedule && data.SchoolSchedule[1]) {
                    const events = data.SchoolSchedule[1].row;
                    scheduleBox.innerHTML = '';
                    events.forEach(event => {
                        scheduleBox.innerHTML += `
                            <div class="flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                <span class="font-semibold text-slate-800 text-[15px]">${event.EVENT_NM}</span>
                            </div>
                        `;
                    });
                    if (scheduleCard) scheduleCard.classList.remove('hidden');
                } else {
                    if (scheduleCard) scheduleCard.classList.add('hidden');
                }
            })
            .catch(() => {
                if (scheduleCard) scheduleCard.classList.add('hidden');
            });
    }

    // --- 급식 API ---
    function loadMeal(schoolInfo, dateStr) {
        const mealBox = document.getElementById('meal-content-box');
        if (!mealBox) return;

        mealBox.innerHTML = '<p class="text-sm text-slate-400">급식 정보를 불러오는 중...</p>';

        fetch(`${API_BASE_URL}/MealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${schoolInfo.officeCode}&SD_SCHUL_CODE=${schoolInfo.schoolCode}&MLSV_YMD=${dateStr}`)
            .then(res => res.json())
            .then(data => {
                if (data.MealServiceDietInfo && data.MealServiceDietInfo[1]) {
                    const mealData = data.MealServiceDietInfo[1].row[0];
                    // 알레르기 원산지 수식어 제거 및 깔끔한 출력 처리
                    const cleanMenu = mealData.DDISH_NM
                        .replace(/\([0-9\.]+\)/g, '') // 알레르기 번호 제거
                        .split('<br/>')
                        .map(item => item.trim())
                        .filter(item => item.length > 0)
                        .join('<br>');

                    mealBox.innerHTML = `
                        <div class="text-slate-700 text-[15px] leading-relaxed font-medium">
                            ${cleanMenu}
                        </div>
                        <div class="text-xs text-slate-400 mt-2">
                            🔥 칼로리: ${mealData.CAL_INFO || '정보 없음'}
                        </div>
                    `;
                } else {
                    mealBox.innerHTML = '<p class="text-sm text-slate-400">🍱 등록된 급식 식단이 없습니다. (휴업일/방학 등)</p>';
                }
            })
            .catch(() => {
                mealBox.innerHTML = '<p class="text-sm text-slate-400">⚠️ 급식 정보를 불러오지 못했습니다.</p>';
            });
    }

    // --- 시간표 API (초/중/고 자동 분기) ---
    function loadTimetable(schoolInfo, dateStr) {
        const unifiedRowsContainer = document.getElementById('unified-rows'); // 본인의 시간표 tbody ID 확인
        if (!unifiedRowsContainer) return;

        // 학교 종류에 맞게 나이스 시간표 엔드포인트 선택
        let endpoint = 'hisTimetable'; // 기본값: 고등학교
        if (schoolInfo.kind === '중학교') endpoint = 'misTimetable';
        else if (schoolInfo.kind === '초등학교') endpoint = 'elsTimetable';

        fetch(`${API_BASE_URL}/${endpoint}?Type=json&ATPT_OFCDC_SC_CODE=${schoolInfo.officeCode}&SD_SCHUL_CODE=${schoolInfo.schoolCode}&ALL_TI_YMD=${dateStr}`)
            .then(res => res.json())
            .then(data => {
                const matrix = { 1: {}, 2: {}, 3: {} };
                let hasAnyData = false;

                if (data[endpoint] && data[endpoint][1]) {
                    const rows = data[endpoint][1].row;
                    rows.forEach(rowItem => {
                        const grade = parseInt(rowItem.GRADE);
                        const period = parseInt(rowItem.PERIO);
                        const subjectName = rowItem.ITRT_CNTNT || "";

                        if (grade >= 1 && grade <= 3 && period >= 1 && period <= 7) {
                            if (subjectName) {
                                matrix[grade][period] = subjectName.trim();
                            }
                        }
                    });
                }

                const savedMapping = JSON.parse(safeStorage.getItem('teacherMapping') || '{}');
                unifiedRowsContainer.innerHTML = '';

                for (let p = 1; p <= 7; p++) {
                    const g1 = matrix[1][p];
                    const g2 = matrix[2][p];
                    const g3 = matrix[3][p];

                    if (g1 || g2 || g3) {
                        hasAnyData = true;

                        const renderCell = (subject) => {
                            if (!subject) return '<td class="py-3 px-1 text-center text-slate-300 text-[15px] font-normal">-</td>';
                            const teacher = savedMapping[subject];
                            const displayTeacher = teacher ? `<span class="text-xs text-blue-600 font-normal ml-0.5">(${teacher})</span>` : '';
                            return `
                                <td class="py-3 px-1 text-center cursor-pointer hover:bg-blue-50/50 transition-colors" onclick="showTeacherTooltip('${subject}')">
                                    <span class="font-medium text-slate-700 text-[16px]">${subject}</span>${displayTeacher}
                                </td>
                            `;
                        };

                        const rowHtml = `
                            <tr class="hover:bg-slate-50/80 transition-colors">
                                <td class="py-3 text-center text-xs font-bold text-slate-400 bg-slate-50/50">${p}교시</td>
                                ${renderCell(g1)}
                                ${renderCell(g2)}
                                ${renderCell(g3)}
                            </tr>
                        `;
                        unifiedRowsContainer.innerHTML += rowHtml;
                    }
                }

                if (!hasAnyData) {
                    unifiedRowsContainer.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-8 text-sm text-slate-400 font-medium">
                                📅 조회된 시간표가 없습니다. (등록 전이거나 휴업일/주말입니다)
                            </td>
                        </tr>
                    `;
                }
            })
            .catch(() => {
                unifiedRowsContainer.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-8 text-sm text-red-400 font-medium">
                            ⚠️ 시간표 데이터를 불러오는 중 오류가 발생했습니다.
                        </td>
                    </tr>
                `;
            });
    }

    function resetSchool() {
        safeStorage.removeItem('fixedSchool');
        document.getElementById('main-view').classList.add('hidden');
        document.getElementById('setup-view').classList.remove('hidden');
        document.getElementById('search-input').value = '';
        document.getElementById('search-results').innerHTML = '';
    }

    // 페이지 시작 로드
    document.addEventListener('DOMContentLoaded', initApp);
</script>
